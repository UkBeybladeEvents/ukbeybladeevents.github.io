<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><style>
body{margin:0}
.p{position:relative;width:1080px;height:1350px;overflow:hidden;background:#DCE6F5;font-family:'Inter',sans-serif;color:#0B1B3F}
.band{position:absolute;left:0;right:0;top:0;height:470px;background:#0B1B3F;clip-path:polygon(0 0,100% 0,100% 78%,0 100%)}
.red{position:absolute;top:0;bottom:0;right:0;width:430px;background:#C8102E;clip-path:polygon(40% 0,100% 0,100% 100%,0 100%)}
.logo{position:absolute;right:72px;top:56px}
.head{position:absolute;left:72px;top:72px;color:#FFFFFF}
.k{font-size:24px;font-weight:800;letter-spacing:8px;color:#FFB3B8}
.h{font-family:'Inter Display',sans-serif;font-weight:900;font-size:132px;line-height:.86;letter-spacing:-4px;margin-top:12px;transform:skewX(-6deg);transform-origin:left}
.r{font-size:32px;font-weight:700;margin-top:22px;color:#FFFFFF}
.list{position:absolute;left:72px;right:72px;top:470px;bottom:110px;display:flex;flex-direction:column;justify-content:center}
.ev{display:grid;grid-template-columns:118px minmax(0,1fr);gap:28px;align-items:center;padding:22px 0;border-bottom:3px solid rgba(11,27,63,.15)}
.ev:last-child{border-bottom:0}
.dt{display:flex;flex-direction:column;line-height:1}
.dt span{font-size:24px;font-weight:800;letter-spacing:4px;color:#C8102E}
.dt b{font-family:'Inter Display',sans-serif;font-weight:900;font-size:84px;letter-spacing:-3px}
.nm{font-family:'Inter Display',sans-serif;font-weight:900;font-size:44px;line-height:1.04;letter-spacing:-1px}
.mt{font-size:28px;font-weight:600;color:#3A4A6E;margin-top:6px}
.f{position:absolute;left:72px;right:72px;bottom:48px;display:flex;justify-content:space-between;gap:24px;font-size:22px;font-weight:600;color:#3A4A6E}
.f b{color:#0B1B3F;font-weight:800}
</style></head><body>
<!-- MONDAY "THIS WEEK" POST (1080x1350). Poster style, deliberately unlike the Thursday ticket stubs.
     Edit: the date range in .r, then one .ev per event (Mon-Sun of this week, date order, max 6).
     Each .ev: weekday (3 letters) + day number, event name, then "City · start time · price". -->
<div class="p">
<div class="band"><div class="red"></div></div>
<div class="logo"><svg id="badge" width="208" height="260" viewBox="0 0 560 700" xmlns="http://www.w3.org/2000/svg">
  <defs><clipPath id="c"><rect x="24" y="24" width="512" height="652" rx="58"/></clipPath></defs>
  <rect x="4" y="4" width="552" height="692" rx="72" fill="#FFFFFF"/>
  <g clip-path="url(#c)">
    <rect width="560" height="700" fill="#0B1B3F"/>
    <polygon points="250,0 560,0 560,700 330,700" fill="#C8102E"/>

    <g transform="translate(-44 -14)"><!-- blader behind, leaping towards the viewer's left, launch arm aimed down at the top -->
    <g stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 452 330 L 514 404 L 548 486" stroke-width="48"/>
      <path d="M 420 336 L 356 384 L 330 452" stroke-width="52"/>
      <path d="M 366 224 L 304 262 L 258 292" stroke-width="40"/>
      <path d="M 424 222 L 482 196 L 520 146" stroke-width="38"/>
      <path d="M 520 146 Q 548 186 540 236" stroke-width="6"/>
    </g>
    <g fill="#FFFFFF">
      <path d="M 338 218 Q 376 190 432 200 Q 458 212 460 240 L 466 330 Q 462 358 428 358 Q 398 358 390 334 Z"/>
      <circle cx="374" cy="166" r="42"/>
      <path d="M 382 196 L 414 214 L 392 232 L 366 206 Z"/>
      <path d="M 334 154 Q 340 120 378 118 L 400 90 L 406 120 L 438 102 L 430 130 L 466 126 L 434 150 L 460 164 L 418 172 Q 392 148 334 154 Z"/>
      <rect x="208" y="270" width="66" height="44" rx="12" transform="rotate(28 241 292)"/>
      <path d="M 516 474 L 562 466 L 562 506 L 524 510 Z"/>
    </g>

    </g>
    <!-- speed lines from the launcher to the top -->
    <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity=".8">
      <path d="M 176 318 L 150 360" stroke-width="7"/>
      <path d="M 206 322 L 188 366" stroke-width="5"/>
      <path d="M 146 310 L 112 352" stroke-width="5"/>
    </g>

    <!-- the top, big in the foreground, seen from slightly above (original four-wing blade) -->
    <g transform="translate(206 470) rotate(-10) scale(0.92)">
      <path d="M -34 34 L 34 34 L 30 70 L -30 70 Z" fill="#FFFFFF" stroke="#0B1B3F" stroke-width="6"/>
      <path d="M -22 70 L 22 70 L 6 108 L -6 108 Z" fill="#FFFFFF" stroke="#0B1B3F" stroke-width="6"/>
      <g transform="scale(1 0.55)">
        <circle cx="0" cy="46" r="96" fill="#FFFFFF" stroke="#0B1B3F" stroke-width="9"/>
        <path d="M 83.2 -11.7 Q 149.9 5.2 122.3 118.1 Q 101.9 74.1 44.5 71.2 Z" fill="#FFFFFF" stroke="#0B1B3F" stroke-width="9" stroke-linejoin="round"/><path d="M 11.7 83.2 Q -5.2 149.9 -118.1 122.3 Q -74.1 101.9 -71.2 44.5 Z" fill="#FFFFFF" stroke="#0B1B3F" stroke-width="9" stroke-linejoin="round"/><path d="M -83.2 11.7 Q -149.9 -5.2 -122.3 -118.1 Q -101.9 -74.1 -44.5 -71.2 Z" fill="#FFFFFF" stroke="#0B1B3F" stroke-width="9" stroke-linejoin="round"/><path d="M -11.7 -83.2 Q 5.2 -149.9 118.1 -122.3 Q 74.1 -101.9 71.2 -44.5 Z" fill="#FFFFFF" stroke="#0B1B3F" stroke-width="9" stroke-linejoin="round"/>
        <circle r="96" fill="#FFFFFF" stroke="#0B1B3F" stroke-width="9"/>
        <circle r="50" fill="#0B1B3F"/>
        <circle r="18" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- spin swooshes round the top -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
      <path d="M 40 566 Q 196 620 352 548" stroke-width="9"/>
      <path d="M 70 600 Q 196 644 326 590" stroke-width="6" opacity=".6"/>
    </g>
  </g>
</svg></div>
<div class="head"><div class="k">UK BEYBLADE EVENTS</div><div class="h">THIS<br>WEEK</div><div class="r">9 – 15 November</div></div>
<div class="list">
<div class="ev"><div class="dt"><span>THU</span><b>12</b></div><div class="in"><div class="nm">Open League</div><div class="mt">Swindon · 6:30pm · £3.50</div></div></div>
<div class="ev"><div class="dt"><span>SAT</span><b>14</b></div><div class="in"><div class="nm">No Surrender</div><div class="mt">Bristol · 10am · £16.96</div></div></div>
<div class="ev"><div class="dt"><span>SUN</span><b>15</b></div><div class="in"><div class="nm">GEARS Kids League</div><div class="mt">London · 11am · £11</div></div></div>
</div>
<div class="f"><div><b>Tickets and sign-ups: link in bio</b></div><div>Fan-run · not affiliated with Takara Tomy or Hasbro</div></div>
</div>
</body></html>
